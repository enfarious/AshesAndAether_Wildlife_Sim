[package]
name = "wildlife_sim"
version = "0.1.0"
edition = "2021"
description = "Wildlife and flora simulation for Ashes & Aether"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# Redis
redis = { version = "0.25", features = ["tokio-comp", "connection-manager"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Random number generation
rand = "0.8"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Time handling
chrono = { version = "0.4", features = ["serde"] }

# Configuration
config = "0.14"

# Error handling
thiserror = "1"
anyhow = "1"

# CLI argument parsing
clap = { version = "4", features = ["derive"] }

# Async stream utilities
futures-util = "0.3"

# HTTP client for fetching terrain data from server
reqwest = { version = "0.12", features = ["json"] }

# Bitflags for walkability flags
bitflags = "2"

[dev-dependencies]
tokio-test = "0.4"
