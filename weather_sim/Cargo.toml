[package]
name = "weather_sim"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "weather_sim"
path = "src/main.rs"

[dependencies]
tokio = { version = "1.49", features = ["full"] }
redis = { version = "0.27", features = ["tokio-comp", "connection-manager"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rand = "0.8"
